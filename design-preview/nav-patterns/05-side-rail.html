<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05. Side Rail · 맵맵맵</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fafaf7;--panel:#fff;--text:#1a1a1a;--text-3:#6e6e6e;--text-4:#9a9a9a;--border:rgba(0,0,0,.08);
    --surface:#f5f2ee;--spice:#c5171e;--spice-2:#ff6b35;--gradient:linear-gradient(135deg,#c5171e,#ff6b35);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .demo-bar{position:fixed;top:0;left:64px;right:0;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:50}
  .demo-bar h1{font-size:13px;font-weight:700} .demo-bar .help{font-size:11px;color:var(--text-3)}

  .rail{position:fixed;left:0;top:0;bottom:0;width:64px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;z-index:100;transition:width .3s cubic-bezier(.16,1,.3,1)}
  .rail:hover{width:220px;box-shadow:8px 0 24px rgba(0,0,0,.06)}
  .rail .logo{width:40px;height:40px;border-radius:10px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;margin-bottom:14px;box-shadow:0 4px 12px rgba(197,23,30,.3)}
  .rail .nav{display:flex;flex-direction:column;gap:4px;width:100%;padding:0 10px;flex:1}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;color:var(--text-3);transition:all .15s;background:none;border:none;font-family:inherit;width:100%;overflow:hidden;white-space:nowrap}
  .nav-item:hover{background:var(--surface);color:var(--text)}
  .nav-item.active{background:var(--gradient);color:#fff;box-shadow:0 2px 8px rgba(197,23,30,.25)}
  .nav-item .ico{font-size:20px;width:20px;flex-shrink:0;text-align:center}
  .nav-item .label{font-size:13px;font-weight:590;opacity:0;transition:opacity .2s .1s}
  .rail:hover .nav-item .label{opacity:1}
  .rail .user{padding:0 10px;width:100%}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--surface);cursor:pointer}
  .user-chip .ava{width:28px;height:28px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .user-chip .info{opacity:0;transition:opacity .2s .1s;overflow:hidden;white-space:nowrap}
  .rail:hover .user-chip .info{opacity:1}
  .user-chip .nm{font-size:12px;font-weight:590} .user-chip .lv{font-size:10px;color:var(--text-3)}

  .main{position:fixed;left:64px;top:42px;right:0;bottom:0;padding:32px;overflow-y:auto;text-align:center}
  .main h2{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
  .main h2 .accent{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .main p{font-size:15px;color:var(--text-3);max-width:540px;margin:0 auto 32px;line-height:1.6}
  .demo-card{display:inline-block;text-align:left;padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);max-width:480px}
  .demo-card .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .demo-card .row:last-child{border:none}
  .demo-card .ic{font-size:18px;width:24px}
  .demo-card .desc{color:var(--text-3);font-size:12px}
</style>
</head><body>

<nav class="rail">
  <div class="logo">🌶</div>
  <div class="nav">
    <button class="nav-item"><span class="ico">👤</span><span class="label">로그인</span></button>
    <button class="nav-item"><span class="ico">🌶</span><span class="label">맵 레벨</span></button>
    <button class="nav-item active"><span class="ico">🗺</span><span class="label">지도</span></button>
    <button class="nav-item"><span class="ico">🍜</span><span class="label">맛집</span></button>
    <button class="nav-item"><span class="ico">✍</span><span class="label">매운맛 인증</span></button>
    <button class="nav-item"><span class="ico">📋</span><span class="label">마이페이지</span></button>
    <button class="nav-item"><span class="ico">🛡</span><span class="label">관리자</span></button>
  </div>
  <div class="user">
    <div class="user-chip">
      <div class="ava">맵</div>
      <div class="info"><div class="nm">맵친자</div><div class="lv">Lv.3 🔥</div></div>
    </div>
  </div>
</nav>

<div class="demo-bar"><h1>05. Sticky Side Rail</h1><span class="help">대표: Linear · Vercel · Slack · Discord</span></div>

<div class="main">
  <h2>아이콘만, <span class="accent">호버 시 라벨</span></h2>
  <p>화면 좌측 64px 폭의 얇은 사이드바. 호버하면 220px로 확장되며 라벨 노출. 콘텐츠 영역을 최대로 보장하는 데스크톱 표준.</p>
  <div class="demo-card">
    <div class="row"><span class="ic">👈</span><div><strong>왼쪽 사이드바에 마우스를 올려보세요</strong><div class="desc">240ms 만에 220px로 확장됩니다</div></div></div>
    <div class="row"><span class="ic">⌨️</span><div><strong>키보드 친화</strong><div class="desc">Tab으로 이동, 단축키와 결합 가능</div></div></div>
    <div class="row"><span class="ic">🌶</span><div><strong>아이덴티티 + 기능 분리</strong><div class="desc">상단 로고, 중간 메뉴, 하단 사용자</div></div></div>
  </div>
</div>
</body></html>

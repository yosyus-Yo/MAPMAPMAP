<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03. FAB Speed Dial · 맵맵맵</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fafaf7;--text:#1a1a1a;--text-3:#6e6e6e;--border:rgba(0,0,0,.08);--surface:#f5f2ee;
    --spice:#c5171e;--spice-2:#ff6b35;--gradient:linear-gradient(135deg,#c5171e,#ff6b35);}
  *{margin:0;padding:0;box-sizing:border-box} html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  .demo-bar{position:fixed;top:0;left:0;right:0;padding:12px 20px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:200}
  .demo-bar h1{font-size:13px;font-weight:700} .demo-bar .help{font-size:11px;color:var(--text-3)}

  .stage{position:fixed;inset:0;background:linear-gradient(180deg,#fff8f0,#fff2e8);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .stage::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 60px)}
  .info{position:relative;text-align:center;padding:0 24px}
  .info h2{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
  .info h2 .accent{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .info p{font-size:15px;color:var(--text-3);max-width:420px;margin:0 auto;line-height:1.6}
  .arrow{margin-top:48px;font-size:30px;animation:bounce 1.5s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  /* FAB */
  .fab-wrap{position:fixed;bottom:32px;right:32px;z-index:50}
  .fab{width:64px;height:64px;border-radius:50%;background:var(--gradient);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 8px 32px rgba(197,23,30,.4),0 0 30px rgba(255,107,53,.3);transition:transform .2s;display:flex;align-items:center;justify-content:center}
  .fab:hover{transform:scale(1.05)}
  .fab.open{transform:rotate(45deg)}

  .actions{position:absolute;bottom:80px;right:8px;display:flex;flex-direction:column;gap:12px;align-items:flex-end;pointer-events:none}
  .action-item{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px) scale(.9);transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
  .fab-wrap.open .action-item{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .fab-wrap.open .action-item:nth-child(1){transition-delay:.05s}
  .fab-wrap.open .action-item:nth-child(2){transition-delay:.1s}
  .fab-wrap.open .action-item:nth-child(3){transition-delay:.15s}
  .fab-wrap.open .action-item:nth-child(4){transition-delay:.2s}
  .action-item .label{padding:8px 12px;background:#1a1a1a;color:#fff;border-radius:6px;font-size:12px;font-weight:590;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .action-item .btn{width:48px;height:48px;border-radius:50%;background:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .action-item .btn:hover{background:var(--surface)}
  .action-item:nth-child(1) .btn{background:var(--gradient);color:#fff}

  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .backdrop.open{opacity:1;pointer-events:auto}
</style>
</head><body>
<div class="demo-bar"><h1>03. FAB + Speed Dial</h1><span class="help">대표: Material Design · Twitter · Google Maps</span></div>

<div class="stage">
  <div class="info">
    <h2><span class="accent">한 손가락</span>으로 모든 액션</h2>
    <p>화면 우측 하단의 큰 버튼 하나가 부채꼴로 펼쳐집니다. 모바일에서 가장 친숙한 패턴 — 엄지 닿는 위치에 핵심 액션.</p>
    <div class="arrow">↘</div>
  </div>
</div>

<div class="backdrop" id="bd" onclick="toggle()"></div>

<div class="fab-wrap" id="fw">
  <div class="actions">
    <div class="action-item">
      <span class="label">매운맛 인증</span>
      <button class="btn" onclick="run('인증')">✍</button>
    </div>
    <div class="action-item">
      <span class="label">내 위치</span>
      <button class="btn" onclick="run('위치')">📍</button>
    </div>
    <div class="action-item">
      <span class="label">맛집 검색</span>
      <button class="btn" onclick="run('검색')">🔍</button>
    </div>
    <div class="action-item">
      <span class="label">필터</span>
      <button class="btn" onclick="run('필터')">🌶</button>
    </div>
  </div>
  <button class="fab" id="fab" onclick="toggle()">+</button>
</div>

<script>
  function toggle(){
    document.getElementById('fw').classList.toggle('open');
    document.getElementById('fab').classList.toggle('open');
    document.getElementById('bd').classList.toggle('open');
  }
  function run(name){ alert('실행: ' + name); toggle(); }
</script>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01. ⌘K Command Palette · 맵맵맵</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;590;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fafaf7; --panel:#fff; --text:#1a1a1a; --text-3:#6e6e6e; --text-4:#9a9a9a;
    --border:rgba(0,0,0,.08); --surface:#f5f2ee; --spice:#c5171e; --spice-2:#ff6b35;
    --gradient: linear-gradient(135deg,#c5171e 0%,#ff6b35 100%);
    --shadow-lg: 0 20px 60px rgba(0,0,0,.18); }
  *{margin:0;padding:0;box-sizing:border-box} body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
  .demo-bar{padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .demo-bar h1{font-size:14px;font-weight:700} .demo-bar .help{font-size:12px;color:var(--text-3)}
  .kbd{display:inline-block;padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);font-family:monospace;font-size:11px;font-weight:590}
  .stage{padding:60px 24px;max-width:920px;margin:0 auto;text-align:center}
  .stage h2{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
  .stage h2 .accent{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .stage p{font-size:15px;color:var(--text-3);margin-bottom:32px;line-height:1.6}
  .open-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:#fff;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:all .15s}
  .open-btn:hover{border-color:var(--spice-2);box-shadow:0 8px 24px rgba(255,107,53,.2)}
  .open-btn .placeholder{color:var(--text-4)}
  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:48px;text-align:left}
  .feat{padding:18px;background:#fff;border:1px solid var(--border);border-radius:12px}
  .feat .ico{font-size:24px;margin-bottom:8px}
  .feat h3{font-size:14px;font-weight:700;margin-bottom:4px} .feat p{font-size:12px;color:var(--text-3);line-height:1.5}

  /* Command Palette Modal */
  .palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:1000;animation:fadeIn .15s}
  .palette-overlay.open{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .palette{width:100%;max-width:640px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:slideDown .2s cubic-bezier(.34,1.56,.64,1)}
  @keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .palette-input{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
  .palette-input .icon{font-size:18px;color:var(--text-3)}
  .palette-input input{flex:1;border:none;outline:none;font-family:inherit;font-size:16px;color:var(--text);background:transparent}
  .palette-input input::placeholder{color:var(--text-4)}
  .palette-input .close{padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:monospace;color:var(--text-3)}
  .palette-list{max-height:60vh;overflow-y:auto;padding:6px 0}
  .group-label{padding:8px 20px 4px;font-size:10px;font-weight:700;color:var(--text-4);text-transform:uppercase;letter-spacing:.06em}
  .pal-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;font-size:13px}
  .pal-item:hover,.pal-item.active{background:linear-gradient(90deg,rgba(255,107,53,.08),transparent)}
  .pal-item.active{border-left:3px solid;border-image:var(--gradient) 1;padding-left:17px}
  .pal-item .ico{font-size:18px;width:24px;text-align:center}
  .pal-item .name{flex:1;font-weight:590}
  .pal-item .meta{font-size:11px;color:var(--text-3);font-family:monospace}
  .pal-item .arrow{color:var(--text-4);font-size:12px}
  .palette-foot{padding:8px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:14px;font-size:11px;color:var(--text-3)}
  .palette-foot span{display:flex;align-items:center;gap:4px}
</style>
</head><body>
<div class="demo-bar">
  <h1>01. ⌘K Command Palette</h1>
  <span class="help">대표: Linear · Vercel · GitHub · Notion</span>
</div>

<div class="stage">
  <h2><span class="accent">⌘K</span> 한 번이면 어디든 갑니다</h2>
  <p>메뉴를 외우지 않아도 됩니다. <span class="kbd">⌘</span> + <span class="kbd">K</span>로 검색하고, 화살표로 이동하고, <span class="kbd">⏎</span> 로 실행.</p>
  <button class="open-btn" onclick="openPalette()">
    <span>🔍</span>
    <span class="placeholder">검색하거나 명령 실행…</span>
    <span class="kbd" style="margin-left:auto">⌘ K</span>
  </button>

  <div class="feature-grid">
    <div class="feat"><div class="ico">⚡</div><h3>빠른 액션</h3><p>"리뷰 작성", "찜 보기" 같은 액션을 메뉴 없이 즉시 실행</p></div>
    <div class="feat"><div class="ico">🌶</div><h3>자연어 검색</h3><p>"강남 짬뽕 Lv.3"처럼 가게 + 필터를 한 번에</p></div>
    <div class="feat"><div class="ico">⌨️</div><h3>키보드 우선</h3><p>마우스 없이 모든 화면 이동 — 파워유저용</p></div>
  </div>
</div>

<div class="palette-overlay" id="overlay" onclick="if(event.target===this)closePalette()">
  <div class="palette">
    <div class="palette-input">
      <span class="icon">🔍</span>
      <input id="q" placeholder="가게 검색, 액션 실행..." autofocus oninput="filter(this.value)">
      <span class="close">ESC</span>
    </div>
    <div class="palette-list" id="list"></div>
    <div class="palette-foot">
      <span><span class="kbd">↑↓</span> 이동</span>
      <span><span class="kbd">⏎</span> 선택</span>
      <span><span class="kbd">ESC</span> 닫기</span>
      <span style="margin-left:auto">🌶 mapmapmap</span>
    </div>
  </div>
</div>

<script>
  const items = [
    {g:'식당', i:'🍜', n:'불맛탱탱 짬뽕집', m:'9,000원 · Lv.3 🔥 · 종로구'},
    {g:'식당', i:'🍜', n:'디진다 돈까스', m:'13,000원 · Lv.5 💀 · 중구'},
    {g:'식당', i:'🍜', n:'엽기 떡볶이 본점', m:'15,000원 · Lv.4 💣 · 영등포구'},
    {g:'식당', i:'🍚', n:'청양 칼국수', m:'8,500원 · Lv.2 🌶 · 마포구'},
    {g:'액션', i:'✍', n:'매운맛 인증하기', m:'새 리뷰 작성'},
    {g:'액션', i:'❤', n:'찜한 가게 보기', m:'12개'},
    {g:'액션', i:'🌶', n:'맵 레벨 변경', m:'현재 Lv.3'},
    {g:'액션', i:'📍', n:'내 위치로 이동', m:''},
    {g:'화면', i:'🗺', n:'지도 메인', m:'/map'},
    {g:'화면', i:'📋', n:'마이페이지', m:'/mypage'},
    {g:'화면', i:'🛡', n:'관리자 대시보드', m:'/admin'},
  ];
  let active = 0;
  function render(arr){
    const groups = {};
    arr.forEach(it => { if(!groups[it.g])groups[it.g]=[]; groups[it.g].push(it); });
    let h = '', idx = 0;
    for (const g in groups){
      h += `<div class="group-label">${g}</div>`;
      groups[g].forEach(it => {
        h += `<div class="pal-item ${idx===active?'active':''}" data-idx="${idx}" onclick="select(${idx})"><div class="ico">${it.i}</div><div class="name">${it.n}</div><div class="meta">${it.m}</div><div class="arrow">→</div></div>`;
        idx++;
      });
    }
    document.getElementById('list').innerHTML = h || `<div style="padding:32px;text-align:center;color:#9a9a9a">결과 없음</div>`;
  }
  let current = items;
  function filter(q){
    current = items.filter(it => it.n.toLowerCase().includes(q.toLowerCase()) || it.m.toLowerCase().includes(q.toLowerCase()));
    active = 0; render(current);
  }
  function select(i){ alert('실행: ' + current[i].n); closePalette(); }
  function openPalette(){ document.getElementById('overlay').classList.add('open'); document.getElementById('q').focus(); render(items); }
  function closePalette(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('q').value=''; current = items; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k'){ e.preventDefault(); openPalette(); return; }
    if (!document.getElementById('overlay').classList.contains('open')) return;
    if (e.key === 'Escape') closePalette();
    if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active+1, current.length-1); render(current); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(active-1, 0); render(current); }
    if (e.key === 'Enter' && current[active]) select(active);
  });
</script>
</body></html>

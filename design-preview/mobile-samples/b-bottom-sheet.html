<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>B. 바텀시트 중심</title>
<style>
  :root{
    --bg:#fafaf7;--panel:#fff;--surface:#f5f2ee;--surface-2:#ebe6df;
    --text:#1a1a1a;--text-3:#6e6e6e;
    --spice:#c5171e;--spice-2:#ff6b35;--gradient:linear-gradient(135deg,#c5171e,#ff6b35);
    --border:rgba(0,0,0,.08);--shadow-sm:0 2px 8px rgba(0,0,0,.1);--shadow-lg:0 8px 28px rgba(0,0,0,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--text);overflow:hidden}
  .map{position:absolute;top:0;left:0;right:0;height:56%;background:linear-gradient(180deg,#fff8f0,#fff2e8);overflow:hidden}
  .road{position:absolute;background:#fff;opacity:.85}.road.h{height:16px;left:-10%;right:-10%}.road.v{width:16px;top:-10%;bottom:-10%}
  .blk{position:absolute;background:rgba(197,23,30,.03);border-radius:6px}
  .mk{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);z-index:2}
  .mk .bub{background:#fff;border:1.5px solid var(--spice);color:var(--spice);font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow-sm)}
  .mk .pin{font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .legend{position:absolute;top:14px;left:14px;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:6px 11px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
  .chip{position:absolute;top:14px;right:14px;z-index:10;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:18px}
  .fab{position:absolute;right:14px;top:calc(56% - 58px);z-index:10;width:44px;height:44px;border-radius:50%;background:var(--gradient);color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;font-size:19px;border:2px solid #fff}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:44%;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.14);z-index:9;display:flex;flex-direction:column;padding-bottom:60px}
  .sheet .grip{width:42px;height:5px;background:var(--surface-2);border-radius:3px;margin:9px auto 6px}
  .sheet .head{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px}
  .sheet .head h2{font-size:15px}.sheet .head .cnt{font-size:12px;color:var(--text-3)}
  .tabs{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto}
  .tabs button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-3)}
  .tabs button.on{background:var(--gradient);color:#fff;border-color:transparent}
  .list{flex:1;overflow-y:auto;padding:0 14px}
  .card{display:flex;gap:10px;padding:11px 8px;border-bottom:1px solid var(--border)}
  .card .th{width:46px;height:46px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;flex-none}
  .card .meta{flex:1;min-width:0}.card .meta .t{font-weight:700;font-size:13px}
  .card .meta .s{font-size:11px;color:var(--text-3);margin-top:2px}
  .card .lv{font-size:11px;font-weight:700;color:var(--spice);align-self:center}
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:11;height:60px;background:#fff;border-top:1px solid var(--border);display:flex}
  .nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-3)}
  .nav button.on{color:var(--spice)}.nav .ic{font-size:19px}
  .tag{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:11px;padding:3px 10px;border-radius:0 0 8px 8px;z-index:20;opacity:.85}
</style>
</head>
<body>
  <div class="tag">B · 바텀시트 중심</div>
  <div class="map">
    <div class="road h" style="top:40%"></div><div class="road v" style="left:44%"></div><div class="road v" style="left:80%"></div>
    <div class="blk" style="top:46%;left:50%;width:26%;height:30%"></div>
    <div class="mk" style="top:30%;left:32%"><div class="bub">불막창 Lv.4</div><div class="pin">💣</div></div>
    <div class="mk" style="top:50%;left:62%"><div class="bub">엽떡 Lv.3</div><div class="pin">🔥</div></div>
    <div class="mk" style="top:70%;left:26%"><div class="bub">국밥 Lv.1</div><div class="pin">👼</div></div>
  </div>
  <div class="legend">🔥 매운맛 레벨</div>
  <div class="chip">👤</div>
  <div class="fab">📍</div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="head"><h2>💬 최신 리뷰</h2><span class="cnt">24건 · 최신순</span></div>
    <div class="tabs">
      <button class="on">전체</button><button>사진 있음</button><button>🌶 내 레벨</button><button>📍 내 주변</button>
    </div>
    <div class="list">
      <div class="card"><div class="th">💣</div><div class="meta"><div class="t">불막창 한신포차</div><div class="s">⭐ 4.6 · 마포구 · 진짜 맵음 주의</div></div><div class="lv">Lv.4</div></div>
      <div class="card"><div class="th">🔥</div><div class="meta"><div class="t">엽기떡볶이 오리지널</div><div class="s">⭐ 4.3 · 강남구 · 적당히 매운맛</div></div><div class="lv">Lv.3</div></div>
      <div class="card"><div class="th">👼</div><div class="meta"><div class="t">순한 국밥집</div><div class="s">⭐ 4.8 · 종로구 · 안 매워요</div></div><div class="lv">Lv.1</div></div>
    </div>
  </div>
  <nav class="nav">
    <button class="on"><span class="ic">🗺</span>지도</button><button><span class="ic">✍</span>제보</button><button><span class="ic">📋</span>마이</button>
  </nav>
</body>
</html>
